<body id="bod" >
  <div class="container border border-2 border-black bg-warning-subtle w-80 mt-5 h-75">

  <section> 
    <img id="img"  src="https://tse2.mm.bing.net/th/id/OIP.o025C8Z-XU-TQq_LObJYkAHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="calculator"  >
  <div class="heading">
    <h1>BMI CACULATOR</h1>
    <h2>Body Mass Index</h2>
  </div>  
</section>
<nav>

  <div class="bmi-gauge mt-3 mb-3">

    <img src="./WhatsApp Image 2026-09-16 at 11.49.09 AM.jpeg" class="gauge-image">

    <div class="needle" id="needle"></div>

</div>


<div class="row">
<div class="col-6 mt-5">
    <label class="fw-bold fs-5"  for="">Gender:</label>
    <br>
  <input type="radio" id="ml" name="gender">
     <label class="fw-bold fs-5"  for="ml">Male</label>
     <input type="radio" id="fl" name="gender">
     <label class="fw-bold fs-5"  for="fl">Female</label>
   <div class="mt-4">

        <label class="fw-bold fs-5 " >Age:</label>

        <input type="text"
               id="age"
               class="form-control"
               placeholder="Your age in years">

    </div>
</div>
<div class="col-6 mt-5 ">
    <label class="fw-bold fs-5"  for="">Weight:</label>
    <br>
    <input  type="text" id="weight" placeholder="Enter Your Weight in Kgs">
     <div class="mt-4">
        <label class="fw-bold fs-5" >Height:</label>
        <input type="text" id="height" class="form-control " placeholder="Your Height in cms">
    </div>
<div class="colu mt-4" >
<button class="btn btn-warning rounded-pill fw-bold"  onclick="adding()"  >Calculate</button>
<button class="btn btn-dark mx-2 fw-bold " onclick="reset()">Reset</button>

</div>
 </div>   
    </div>

</nav>
<div class="footer text-center text-danger bg-white">
<h3 class="hed p-3">YOUR BMI IS</h3>

    <h3 id="category"></h3>

    <p id="message"></p>
</div>
